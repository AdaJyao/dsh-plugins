# dsh-pi-ai-vision bundle patch：把「模态自动声明」这一行插进 profile 花名册。
#
# 这里**刻意不带任何部署相关的配置**。capabilityUrl 指向的是你这台机器上的模型服务地址，
# 属于「部署」而不是「插件」，所以写在 profile 自己的 cordis.patch.yml 里（更靠后的层，优先级更高）：
#
#   - id: 'dsh-pi-ai-vision'
#     name: 'dsh-pi-ai-vision'
#     config:
#       patternFallback: true
#       routes:
#         llama:                                 # 键 = pi-ai 路由 id
#           capabilityUrl: http://<主机>:<端口>/api/models/list
#           modelsPath: models
#           visionFields: [supportsVision, isMultimodal]
#
# 什么都不配也能用：插件退回保守的模型名模式表（只认 llava / qwen-vl / minicpm-v 这类
# 名字本身无歧义的多模态家族），代价是覆盖不到「名字里看不出视觉能力」的模型。
#
- insert:
    - id: 'dsh-pi-ai-vision'
      name: 'dsh-pi-ai-vision'
